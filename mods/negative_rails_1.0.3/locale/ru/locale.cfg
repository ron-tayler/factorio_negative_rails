[mod-name]
negative_rails=Negative Rails
[mod-description]
negative_rails=Планируйте демонтаж конкретных наземных рельсов с помощью отрицательных рельсов-призраков. Используйте их напрямую или добавляйте в чертежи для перестройки перекрёстков. Надземные рельсы, пандусы и опоры не поддерживаются.
[item-name]
negative-rail=Отрицательные рельсы
[entity-name]
negative-rail=Отрицательный рельс
[entity-description]
negative-rail=На свободном месте остаётся призраком для чертежа. При сверхпринудительном наложении на совпадающий обычный рельс помечает его на демонтаж. Поезда по маркерам не ездят, роботы их не строят. Только наземные рельсы.
[shortcut-name]
give-negative-rail=Отрицательные рельсы
[controls]
give-negative-rail=Взять отрицательные рельсы
